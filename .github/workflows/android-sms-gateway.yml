name: FEWURA SMS Gateway Android build

on:
  push:
    branches: [main]
    paths:
      - 'android-sms-gateway/**'
      - '.github/workflows/android-sms-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-sms-gateway
        run: gradle --no-daemon clean assembleDebug

      - name: Validate APK exists
        run: |
          test -f android-sms-gateway/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android-sms-gateway/app/build/outputs/apk/debug/app-debug.apk | grep -q AndroidManifest.xml

      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: FEWURA-SMS-Gateway-Android-TESTED
          path: android-sms-gateway/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
