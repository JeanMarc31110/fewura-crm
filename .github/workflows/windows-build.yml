name: FEWURA CRM Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Core tests
        shell: pwsh
        run: |
          $env:FEWURA_CRM_DATA_DIR = Join-Path $env:RUNNER_TEMP 'fewura-crm-core'
          python -m py_compile agent.py fewura_crm/__init__.py fewura_crm/paths.py fewura_crm/db.py fewura_crm/tools.py fewura_crm/prospect_engine.py fewura_crm/outreach.py fewura_crm/web.py
          python -m pytest -q
          python agent.py --self-test

      - name: Build Windows EXE
        shell: pwsh
        run: pyinstaller --clean --noconfirm installer/fewura_crm.spec

      - name: Smoke-test frozen EXE
        shell: pwsh
        run: .\TESTER_EXE_WINDOWS.ps1 -ExePath '.\dist\FEWURA_CRM\FEWURA_CRM.exe'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Setup
        shell: pwsh
        run: |
          $iscc = $null
          $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($command) { $iscc = $command.Source }
          if (-not $iscc) {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
              "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
              "$env:ChocolateyInstall\bin\ISCC.exe"
            )
            $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'ISCC.exe introuvable.' }
          & $iscc '.\installer\FEWURA_CRM.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup a retourne le code $LASTEXITCODE" }
          if (-not (Test-Path '.\installer\output\FEWURA_CRM_Setup_1.3.1.exe')) { throw 'Setup attendu non cree.' }

      - name: Prepare legacy install and stale shortcut collision
        shell: pwsh
        run: |
          $legacy1 = Join-Path $env:LOCALAPPDATA 'Programs\FEWURA CRM'
          $legacy2 = Join-Path $env:LOCALAPPDATA 'Programs\FEWURA\CRM'
          New-Item -ItemType Directory -Force -Path $legacy1,$legacy2 | Out-Null
          Set-Content -Path (Join-Path $legacy1 'websockets.py') -Value 'STALE LEGACY FILE'
          Set-Content -Path (Join-Path $legacy2 'FEWURA_CRM.exe') -Value 'STALE LEGACY EXE'
          $desktop = [Environment]::GetFolderPath('Desktop')
          if ($desktop) {
            New-Item -ItemType Directory -Force -Path $desktop | Out-Null
            $ws = New-Object -ComObject WScript.Shell
            $lnk = $ws.CreateShortcut((Join-Path $desktop 'FEWURA CRM.lnk'))
            $lnk.TargetPath = (Join-Path $legacy2 'FEWURA_CRM.exe')
            $lnk.WorkingDirectory = $legacy2
            $lnk.Save()
          }
          "FEWURA_LEGACY1=$legacy1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FEWURA_LEGACY2=$legacy2" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install final Setup silently
        shell: pwsh
        run: |
          $setup = (Resolve-Path '.\installer\output\FEWURA_CRM_Setup_1.3.1.exe').Path
          $installDir = Join-Path $env:RUNNER_TEMP 'FEWURA-CRM-installed'
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$installDir")
          $p = Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installation silencieuse echouee: code $($p.ExitCode)" }
          $installedExe = Join-Path $installDir 'FEWURA_CRM.exe'
          if (-not (Test-Path $installedExe)) { throw "EXE installe introuvable: $installedExe" }
          if (Test-Path (Join-Path $env:FEWURA_LEGACY1 'websockets.py')) { throw 'Ancien fichier legacy non supprime.' }
          if (Test-Path (Join-Path $env:FEWURA_LEGACY2 'FEWURA_CRM.exe')) { throw 'Ancien EXE legacy non supprime.' }
          "FEWURA_CRM_INSTALLED_EXE=$installedExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate desktop shortcut targets new EXE
        shell: pwsh
        run: |
          $expected = (Resolve-Path $env:FEWURA_CRM_INSTALLED_EXE).Path
          $desktopPaths = @(
            [Environment]::GetFolderPath('Desktop'),
            [Environment]::GetFolderPath('CommonDesktopDirectory')
          ) | Where-Object { $_ }
          $links = @()
          $ws = New-Object -ComObject WScript.Shell
          foreach ($d in $desktopPaths) {
            $p = Join-Path $d 'FEWURA CRM.lnk'
            if (Test-Path $p) {
              $target = $ws.CreateShortcut($p).TargetPath
              $links += [pscustomobject]@{ Link=$p; Target=$target }
            }
          }
          if (-not $links) { throw 'Aucun raccourci FEWURA CRM cree.' }
          $valid = $links | Where-Object { $_.Target -and ((Resolve-Path $_.Target -ErrorAction SilentlyContinue).Path -eq $expected) }
          if (-not $valid) { throw ('Raccourci FEWURA CRM pointe vers un ancien EXE: ' + ($links | ConvertTo-Json -Compress)) }

      - name: Smoke-test installed application
        shell: pwsh
        run: .\TESTER_EXE_WINDOWS.ps1 -ExePath "$env:FEWURA_CRM_INSTALLED_EXE"

      - name: Upload fully tested Windows Setup
        uses: actions/upload-artifact@v4
        with:
          name: FEWURA-CRM-Windows-1.3.1-TESTED
          path: installer/output/FEWURA_CRM_Setup_1.3.1.exe
          if-no-files-found: error
