name: Build Windows installer (PyInstaller)

permissions:
  contents: write

on:
  push:
    branches: [ 'windows-installer' ]
  workflow_dispatch: {}

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          python --version
          pip --version
          pip list --format=columns

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile agent.py

      - name: Upload build logs and artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pyinstaller-logs-${{ github.sha }}
          path: |
            build/**/*.txt
            build/**/*.log
            build/**/warn-*.txt
            build/**/warn-*.log
            build/**/xref-*.html
            dist/agent.exe

      - name: Package artifact
        shell: pwsh
        run: |
          $dest = "fewura-crm-windows-${{ github.sha }}.zip"
          Compress-Archive -Path .\dist\agent.exe -DestinationPath $dest -Force
          Write-Output "Zipped to $dest"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: fewura-crm-windows-${{ github.sha }}.zip
          path: fewura-crm-windows-${{ github.sha }}.zip

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: installer-${{ github.sha }}
          release_name: "Windows installer ${{ github.sha }}"
          body: "Automated Windows installer (PyInstaller) built by CI. Download the fewura-crm Windows executable zip attached to this release."
          draft: false
          prerelease: false

      - name: Upload installer to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./fewura-crm-windows-${{ github.sha }}.zip
          asset_name: fewura-crm-windows-${{ github.sha }}.zip
          asset_content_type: application/zip

      - name: Output download URL
        run: echo "Release created: ${{ steps.create_release.outputs.html_url }}"
