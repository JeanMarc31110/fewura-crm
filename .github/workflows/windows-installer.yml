name: Build Windows installer (PyInstaller)

permissions:
  contents: write

on:
  push:
    branches: [ 'windows-installer', 'windows-installer-exe' ]
  workflow_dispatch: {}

jobs:
  build-windows-installer:
    runs-on: windows-latest
    env:
      WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
      WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          python --version
          pip --version
          pip list --format=columns

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile agent.py

      - name: Upload build logs and artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pyinstaller-logs-${{ github.sha }}
          path: |
            build/**/*.txt
            build/**/*.log
            build/**/warn-*.txt
            build/**/warn-*.log
            build/**/xref-*.html
            dist/agent.exe

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build EXE installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }
          & $iscc "installer\FEWURA_CRM_Installer.iss"
          Get-ChildItem .\release -Force | Select-Object FullName, Length

      - name: Sign installer if certificate is configured
        if: ${{ env.WINDOWS_SIGNING_CERT_BASE64 != '' && env.WINDOWS_SIGNING_CERT_PASSWORD != '' }}
        shell: pwsh
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP 'fewura-signing-cert.pfx'
          $encoded = $env:WINDOWS_SIGNING_CERT_BASE64
          [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($encoded))

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match 'x64\\signtool.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signtool) {
            throw "signtool.exe not found in Windows SDK install."
          }

          & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td sha256 /f $certPath /p $env:WINDOWS_SIGNING_CERT_PASSWORD /v "release\FEWURA_CRM_Setup.exe"
          & $signtool.FullName verify /pa /v "release\FEWURA_CRM_Setup.exe"

      - name: Package zip fallback
        shell: pwsh
        run: |
          $dest = "fewura-crm-windows-${{ github.sha }}.zip"
          Compress-Archive -Path .\dist\agent.exe -DestinationPath $dest -Force
          Write-Output "Zipped to $dest"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fewura-crm-windows-${{ github.sha }}
          path: |
            release/FEWURA_CRM_Setup.exe
            fewura-crm-windows-${{ github.sha }}.zip

      - name: Create GitHub Release and upload asset (requires RELEASE_PAT secret)
        uses: ncipollo/release-action@v1
        with:
          tag: installer-${{ github.sha }}
          name: "Windows installer ${{ github.sha }}"
          body: "Automated Windows installer (PyInstaller + Inno Setup) built by CI. If a signing certificate is configured, the installer is code-signed. Otherwise it is unsigned but still usable for internal testing."
          files: |
            fewura-crm-windows-${{ github.sha }}.zip
            release/FEWURA_CRM_Setup.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

      - name: Output release info
        run: |
          echo "Release tag: installer-${{ github.sha }}"
          echo "Primary installer: release/FEWURA_CRM_Setup.exe"
          echo "Fallback artifact: fewura-crm-windows-${{ github.sha }}.zip"
